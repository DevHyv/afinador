<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Afinador Profesional</title>
  <meta name="theme-color" content="#0f0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0f0f12;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 1rem;
      touch-action: manipulation;
    }

    .tuner-card {
      max-width: 720px;
      width: 100%;
      background: #1a1a20;
      border-radius: 2.5rem;
      padding: 2rem 1.5rem 2.5rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.04);
      border: 1px solid #2a2a32;
    }

    .tuner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .tuner-header h1 {
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e8e8f0, #b0b0c0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      user-select: none;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-group {
      background: #26262e;
      padding: 0.25rem;
      border-radius: 2.5rem;
      display: flex;
      border: 1px solid #34343e;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .btn-group button {
      background: transparent;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.85rem;
      color: #8e8e9e;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.01em;
      font-family: 'Inter', sans-serif;
    }

    .btn-group button.active {
      background: #3d3d4a;
      color: #f0f0f8;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .action-btn {
      background: #2e3a48;
      color: #f0f8ff;
      border: 1px solid #5a7a9a;
      padding: 0.6rem 1.5rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 0 #1a2632;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1a2632;
    }

    .action-btn.listening {
      background: #4a2e30;
      border-color: #9a5a5a;
      box-shadow: 0 3px 0 #321a1a, 0 0 12px rgba(200, 70, 70, 0.3);
    }

    .note-display {
      background: #121216;
      border-radius: 3rem;
      padding: 0.8rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #2c2c36;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
    }

    .note-name {
      font-size: 3rem;
      font-weight: 700;
      color: #f0f0fa;
      letter-spacing: 0.02em;
      min-width: 4.5rem;
      user-select: none;
    }

    .note-frequency {
      font-size: 1rem;
      font-weight: 450;
      color: #a8a8b8;
      background: #212129;
      padding: 0.3rem 1rem;
      border-radius: 3rem;
      border: 1px solid #363640;
      letter-spacing: 0.02em;
      user-select: none;
    }

    .tuner-bar-wrapper {
      background: #0c0c10;
      border-radius: 100px;
      height: 10px;
      margin: 1.5rem 0 0.8rem;
      border: 1px solid #2c2c36;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    .tuner-bar-fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #4f6f8f, #80b0d0, #4f6f8f);
      border-radius: 100px;
      transition: width 0.1s ease-out, background 0.3s ease;
      box-shadow: 0 0 16px rgba(100, 170, 220, 0.3);
    }

    .tuner-bar-fill.in-tune {
      background: linear-gradient(90deg, #3a7a4a, #60c080, #3a7a4a);
      box-shadow: 0 0 16px rgba(100, 220, 120, 0.4);
    }

    .cent-indicator {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 500;
      color: #6a6a7a;
      padding: 0 0.2rem;
      margin-top: 0.1rem;
      letter-spacing: 0.02em;
      user-select: none;
    }

    .cent-value {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 600;
      color: #d0d0de;
      margin: 0.2rem 0 0.1rem;
      background: #15151c;
      padding: 0.2rem 0.8rem;
      border-radius: 3rem;
      display: inline-block;
      border: 1px solid #2f2f3a;
      min-width: 80px;
      user-select: none;
      transition: color 0.3s ease;
    }
    
    .cent-value.in-tune {
      color: #60c080;
    }

    .cent-container {
      display: flex;
      justify-content: center;
      margin: 0.4rem 0 1.5rem;
    }

    .strings-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin-top: 1.5rem;
    }

    .string-btn {
      background: #1e1e26;
      border: 1px solid #2e2e3a;
      border-radius: 2rem;
      padding: 0.8rem 0.3rem;
      font-weight: 600;
      font-size: 1rem;
      color: #c8c8d6;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 3px 0 #0b0b0e;
      letter-spacing: 0.02em;
      text-align: center;
      pointer-events: none; /* Disabled in auto mode */
    }

    .string-btn.manual-active {
      pointer-events: auto;
    }

    .string-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #0b0b0e;
    }

    .string-btn.active-string {
      background: #2e3a48;
      border-color: #5a7a9a;
      color: #f0f8ff;
      box-shadow: 0 3px 0 #1a2632, 0 0 12px rgba(70, 140, 200, 0.3);
    }

    .string-btn .string-note {
      display: block;
      font-size: 0.65rem;
      font-weight: 400;
      color: #7a7a8e;
      margin-top: 0.2rem;
      letter-spacing: 0.04em;
    }

    .string-btn.active-string .string-note {
      color: #b0c8e0;
    }

    .status-message {
      text-align: center;
      margin-top: 2rem;
      font-weight: 450;
      color: #8a8a9e;
      background: #18181f;
      padding: 0.6rem 1.2rem;
      border-radius: 3rem;
      border: 1px solid #2a2a34;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      user-select: none;
    }

    .status-message span {
      color: #d0d0e6;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .tuner-card { padding: 1.5rem 1rem; }
      .note-name { font-size: 2.4rem; }
      .strings-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
      .btn-group button { padding: 0.4rem 1rem; font-size: 0.8rem; }
      .tuner-header h1 { font-size: 1.3rem; }
      .controls-row { justify-content: center; }
    }

    @media (min-width: 768px) {
      .strings-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div class="tuner-card">
    <div class="tuner-header">
      <h1>Afinador</h1>
      <div class="btn-group" id="instrumentSelector">
        <button class="active" data-instrument="guitar">Guitarra</button>
        <button data-instrument="bass">Bajo</button>
      </div>
    </div>

    <div class="controls-row">
      <button id="micBtn" class="action-btn">Activar Micrófono</button>
      <div class="btn-group" id="modeSelector">
        <button class="active" data-mode="auto">Automático</button>
        <button data-mode="manual">Manual</button>
      </div>
    </div>

    <div class="note-display">
      <span class="note-name" id="noteName">-</span>
      <span class="note-frequency" id="noteFreq">0.0 Hz</span>
    </div>

    <div class="tuner-bar-wrapper">
      <div class="tuner-bar-fill" id="tunerBar" style="width: 50%;"></div>
    </div>
    <div class="cent-indicator">
      <span>−50</span>
      <span>0</span>
      <span>+50</span>
    </div>
    <div class="cent-container">
      <span class="cent-value" id="centValue">--</span>
    </div>

    <div class="strings-grid" id="stringsContainer"></div>

    <div class="status-message" id="statusMessage">
      <span>⏸</span> Esperando micrófono...
    </div>
  </div>

  <script>
    (function() {
      const GUITAR_STRINGS = [
        { note: 'E', freq: 82.41, label: '6ª' },
        { note: 'A', freq: 110.00, label: '5ª' },
        { note: 'D', freq: 146.83, label: '4ª' },
        { note: 'G', freq: 196.00, label: '3ª' },
        { note: 'B', freq: 246.94, label: '2ª' },
        { note: 'E', freq: 329.63, label: '1ª' }
      ];

      const BASS_STRINGS = [
        { note: 'E', freq: 41.20, label: '4ª' },
        { note: 'A', freq: 55.00, label: '3ª' },
        { note: 'D', freq: 73.42, label: '2ª' },
        { note: 'G', freq: 98.00, label: '1ª' }
      ];

      let currentInstrument = 'guitar';
      let currentStrings = GUITAR_STRINGS;
      let tuningMode = 'auto'; // 'auto' o 'manual'
      let activeStringIndex = 0;
      
      // Audio API Variables
      let audioContext;
      let analyser;
      let microphone;
      let isListening = false;
      let animationId;
      const bufferSize = 2048;
      let buffer = new Float32Array(bufferSize);

      // DOM Elements
      const noteNameEl = document.getElementById('noteName');
      const noteFreqEl = document.getElementById('noteFreq');
      const tunerBar = document.getElementById('tunerBar');
      const centValueEl = document.getElementById('centValue');
      const stringsContainer = document.getElementById('stringsContainer');
      const statusMsg = document.getElementById('statusMessage');
      const instrumentBtns = document.querySelectorAll('#instrumentSelector button');
      const modeBtns = document.querySelectorAll('#modeSelector button');
      const micBtn = document.getElementById('micBtn');

      // --- ALGORITMO DE AUTOCORRELACIÓN (Pitch Detection) ---
      function autoCorrelate(buf, sampleRate) {
        let SIZE = buf.length;
        let rms = 0;
        
        for (let i = 0; i < SIZE; i++) {
          let val = buf[i];
          rms += val * val;
        }
        rms = Math.sqrt(rms / SIZE);
        if (rms < 0.01) return -1; 

        let r1 = 0, r2 = SIZE - 1, thres = 0.2;
        for (let i = 0; i < SIZE / 2; i++)
          if (Math.abs(buf[i]) < thres) { r1 = i; break; }
        for (let i = 1; i < SIZE / 2; i++)
          if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

        buf = buf.slice(r1, r2);
        SIZE = buf.length;

        let c = new Array(SIZE).fill(0);
        for (let i = 0; i < SIZE; i++)
          for (let j = 0; j < SIZE - i; j++)
            c[i] = c[i] + buf[j] * buf[j + i];

        let d = 0; while (c[d] > c[d + 1]) d++;
        let maxval = -1, maxpos = -1;
        
        for (let i = d; i < SIZE; i++) {
          if (c[i] > maxval) {
            maxval = c[i];
            maxpos = i;
          }
        }
        let T0 = maxpos;

        let x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
        let a = (x1 + x3 - 2 * x2) / 2;
        let b = (x3 - x1) / 2;
        if (a) T0 = T0 - b / (2 * a);

        return sampleRate / T0;
      }

      function getCents(freq, targetFreq) {
        return Math.floor(1200 * Math.log2(freq / targetFreq));
      }

      function findClosestString(freq) {
        let closest = currentStrings[0];
        let minDiff = Math.abs(freq - closest.freq);
        let index = 0;

        for (let i = 1; i < currentStrings.length; i++) {
          let diff = Math.abs(freq - currentStrings[i].freq);
          if (diff < minDiff) {
            minDiff = diff;
            closest = currentStrings[i];
            index = i;
          }
        }
        return { string: closest, index: index };
      }

      function updateDisplay(detectedFreq) {
        if (detectedFreq === -1) return; // Silencio o ruido no afinable

        let targetNote, targetFreq, targetIndex;

        if (tuningMode === 'auto') {
          const match = findClosestString(detectedFreq);
          targetNote = match.string.note;
          targetFreq = match.string.freq;
          targetIndex = match.index;
          setActiveString(targetIndex, false);
        } else {
          targetNote = currentStrings[activeStringIndex].note;
          targetFreq = currentStrings[activeStringIndex].freq;
        }

        const cents = getCents(detectedFreq, targetFreq);
        const clamped = Math.min(50, Math.max(-50, cents));
        const percent = 50 + (clamped / 100) * 50;
        
        tunerBar.style.width = percent + '%';
        
        const isTuned = Math.abs(cents) <= 5;
        if (isTuned) {
          tunerBar.classList.add('in-tune');
          centValueEl.classList.add('in-tune');
        } else {
          tunerBar.classList.remove('in-tune');
          centValueEl.classList.remove('in-tune');
        }

        centValueEl.textContent = (cents > 0 ? '+' : '') + cents;
        noteNameEl.textContent = targetNote;
        noteFreqEl.textContent = detectedFreq.toFixed(1) + ' Hz';
      }

      function renderStrings() {
        stringsContainer.innerHTML = '';
        currentStrings.forEach((str, idx) => {
          const btn = document.createElement('button');
          btn.className = 'string-btn';
          if (idx === activeStringIndex) btn.classList.add('active-string');
          if (tuningMode === 'manual') btn.classList.add('manual-active');
          
          btn.dataset.index = idx;
          
          const noteSpan = document.createElement('span');
          noteSpan.textContent = str.note;
          const labelSpan = document.createElement('span');
          labelSpan.className = 'string-note';
          labelSpan.textContent = str.label + '  ' + str.freq.toFixed(1) + 'Hz';
          
          btn.appendChild(noteSpan);
          btn.appendChild(labelSpan);

          btn.addEventListener('click', function() {
            if (tuningMode === 'manual') {
              setActiveString(parseInt(this.dataset.index), true);
            }
          });

          stringsContainer.appendChild(btn);
        });
      }

      function setActiveString(index, updateText = true) {
        if (index === activeStringIndex) return;
        activeStringIndex = index;
        
        document.querySelectorAll('.string-btn').forEach((btn, idx) => {
          btn.classList.toggle('active-string', idx === index);
        });

        if (updateText && tuningMode === 'manual') {
          const str = currentStrings[index];
          noteNameEl.textContent = str.note;
          noteFreqEl.textContent = '- Hz';
          tunerBar.style.width = '50%';
          centValueEl.textContent = '--';
          tunerBar.classList.remove('in-tune');
          centValueEl.classList.remove('in-tune');
        }
      }

      async function toggleMicrophone() {
        if (isListening) {
          audioContext.suspend();
          cancelAnimationFrame(animationId);
          micBtn.textContent = 'Activar Micrófono';
          micBtn.classList.remove('listening');
          statusMsg.innerHTML = `<span>⏸</span> Micrófono pausado`;
          isListening = false;
          return;
        }

        try {
          if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = bufferSize;

            const stream = await navigator.mediaDevices.getUserMedia({ 
              audio: { 
                echoCancellation: false, 
                autoGainControl: false, 
                noiseSuppression: false 
              } 
            });
            
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
          } else {
            await audioContext.resume();
          }

          micBtn.textContent = 'Detener';
          micBtn.classList.add('listening');
          statusMsg.innerHTML = `<span>▶</span> Escuchando...`;
          isListening = true;
          updatePitch();

        } catch (err) {
          console.error(err);
          statusMsg.innerHTML = `<span style="color: #ff5555;">✖</span> Permiso de micrófono denegado`;
        }
      }

      function updatePitch() {
        analyser.getFloatTimeDomainData(buffer);
        const pitch = autoCorrelate(buffer, audioContext.sampleRate);
        
        updateDisplay(pitch);
        
        if (isListening) {
          animationId = requestAnimationFrame(updatePitch);
        }
      }

      function init() {
        renderStrings();

        // Instrument Selection
        instrumentBtns.forEach(btn => {
          btn.addEventListener('click', function() {
            const inst = this.dataset.instrument;
            if (inst === currentInstrument) return;
            
            currentInstrument = inst;
            currentStrings = inst === 'guitar' ? GUITAR_STRINGS : BASS_STRINGS;
            activeStringIndex = 0;
            
            instrumentBtns.forEach(b => b.classList.toggle('active', b === this));
            renderStrings();
            
            noteNameEl.textContent = '-';
            noteFreqEl.textContent = '0.0 Hz';
            tunerBar.style.width = '50%';
            centValueEl.textContent = '--';
            tunerBar.classList.remove('in-tune');
            centValueEl.classList.remove('in-tune');
          });
        });

        // Mode Selection
        modeBtns.forEach(btn => {
          btn.addEventListener('click', function() {
            const mode = this.dataset.mode;
            if (mode === tuningMode) return;
            
            tuningMode = mode;
            modeBtns.forEach(b => b.classList.toggle('active', b === this));
            
            const strings = document.querySelectorAll('.string-btn');
            strings.forEach(s => s.classList.toggle('manual-active', mode === 'manual'));
            
            if (mode === 'manual') {
              setActiveString(0, true);
              statusMsg.innerHTML = `<span>▶</span> Selecciona la cuerda a afinar`;
            } else {
              statusMsg.innerHTML = isListening ? `<span>▶</span> Escuchando...` : `<span>⏸</span> Esperando micrófono...`;
            }
          });
        });

        // Mic Button
        micBtn.addEventListener('click', toggleMicrophone);
      }

      init();
    })();
  </script>
</body>
</html>
